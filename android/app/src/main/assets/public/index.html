<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kamera Geotag</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--ac:#0f766e;--bd:#e2e5ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111417;--card:#1b2026;--tx:#eceff3;--mut:#9aa3af;--ac:#2dd4bf;--bd:#2c333b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.cam{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:3/4}
video,#hasil{width:100%;height:100%;object-fit:cover;display:block}
#hasil{object-fit:contain;display:none}
.ov{position:absolute;left:0;right:0;padding:8px 10px;color:#fff;background:rgba(0,0,0,.45);font-size:12px;line-height:1.35;white-space:pre-wrap}
.ov b{font-size:14px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input[type=text],textarea,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
textarea{resize:vertical;min-height:60px}
.row{display:flex;gap:8px}.row>*{flex:1}
.chk{display:flex;align-items:center;gap:8px;margin:8px 0;color:var(--tx);font-size:14px}
button{border:0;border-radius:12px;padding:12px;font:inherit;font-weight:600;background:var(--ac);color:#fff;cursor:pointer}
button.sec{background:var(--bd);color:var(--tx)}
.shutter{display:block;width:100%;margin-top:10px;font-size:16px}
.st{font-size:12px;color:var(--mut);margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
<h1>📍 Kamera Geotag</h1>

<div class="card">
  <div class="cam">
    <video id="vid" playsinline autoplay muted></video>
    <img id="hasil" alt="Hasil foto">
    <div class="ov" id="ov"></div>
  </div>
  <div class="st" id="st">Memulai kamera…</div>
  <div id="aksiCam">
    <button class="shutter" id="btnFoto">📷 Ambil Foto</button>
    <div class="row" style="margin-top:8px">
      <button class="sec" id="btnBalik">🔄 Balik Kamera</button>
      <button class="sec" id="btnUpload">🖼️ Dari Galeri/Kamera HP</button>
    </div>
  </div>
  <div id="aksiHasil" style="display:none">
    <div class="row" style="margin-top:10px">
      <button id="btnSimpan">💾 Simpan / Bagikan</button>
      <button class="sec" id="btnUlang">↩️ Foto Lagi</button>
    </div>
  </div>
  <input type="file" id="file" accept="image/*" capture="environment" hidden>
</div>

<div class="card">
  <b>Pengaturan Watermark</b>
  <label>Judul foto</label>
  <input type="text" id="judul" placeholder="cth: Survei Lokasi Jalan Usaha Tani">
  <div class="chk"><input type="checkbox" id="tJudul" checked><span>Tampilkan judul</span></div>

  <label>Koordinat</label>
  <select id="modeKoor">
    <option value="gps">Otomatis dari GPS</option>
    <option value="manual">Isi manual</option>
  </select>
  <input type="text" id="koorManual" placeholder="-7.8123456, 110.9123456" style="margin-top:6px;display:none">
  <div class="chk"><input type="checkbox" id="tKoor" checked><span>Tampilkan koordinat</span></div>

  <label>Alamat / keterangan lokasi</label>
  <textarea id="alamat" placeholder="cth: Dusun Ngrapah, Desa Setren, Kec. Slogohimo, Kab. Wonogiri"></textarea>
  <div class="chk"><input type="checkbox" id="tAlamat" checked><span>Tampilkan alamat</span></div>

  <div class="chk"><input type="checkbox" id="tWaktu" checked><span>Tampilkan tanggal &amp; jam</span></div>

  <div class="row">
    <div><label>Posisi</label>
      <select id="posisi"><option value="bawah">Bawah</option><option value="atas">Atas</option></select></div>
    <div><label>Ukuran teks</label>
      <select id="ukuran"><option value="0.7">Kecil</option><option value="1" selected>Sedang</option><option value="1.4">Besar</option></select></div>
  </div>
  <div class="st">Pengaturan tersimpan otomatis di perangkat ini.</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const F=['judul','tJudul','modeKoor','koorManual','tKoor','alamat','tAlamat','tWaktu','posisi','ukuran'];
let stream=null,facing='environment',pos=null,hasilBlob=null;

// ---- simpan/muat pengaturan
function load(){try{const s=JSON.parse(localStorage.getItem('geotag')||'{}');
 F.forEach(k=>{if(!(k in s))return;const e=$(k);e.type==='checkbox'?e.checked=s[k]:e.value=s[k]})}catch(e){}}
function save(){try{const s={};F.forEach(k=>{const e=$(k);s[k]=e.type==='checkbox'?e.checked:e.value});localStorage.setItem('geotag',JSON.stringify(s))}catch(e){}}

// ---- teks watermark
function koorText(){
 if($('modeKoor').value==='manual')return $('koorManual').value.trim();
 if(!pos)return 'Mencari GPS…';
 return pos.latitude.toFixed(6)+', '+pos.longitude.toFixed(6)+' (±'+Math.round(pos.accuracy)+' m)';
}
function waktuText(){return new Date().toLocaleString('id-ID',{day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function baris(){
 const r=[];
 if($('tJudul').checked&&$('judul').value.trim())r.push({t:$('judul').value.trim(),b:1});
 if($('tKoor').checked){const k=koorText();if(k)r.push({t:'📍 '+k})}
 if($('tAlamat').checked&&$('alamat').value.trim())r.push({t:$('alamat').value.trim()});
 if($('tWaktu').checked)r.push({t:waktuText()});
 return r;
}
function updOv(){
 const ov=$('ov'),r=baris();
 ov.style.display=r.length?'block':'none';
 ov.style.top=$('posisi').value==='atas'?'0':'auto';
 ov.style.bottom=$('posisi').value==='atas'?'auto':'0';
 ov.style.fontSize=(12*$('ukuran').value)+'px';
 ov.innerHTML=r.map(x=>x.b?'<b>'+esc(x.t)+'</b>':esc(x.t)).join('\n');
}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// ---- GPS
function startGPS(){
 if(!navigator.geolocation){$('st').textContent='GPS tidak didukung.';return}
 navigator.geolocation.watchPosition(p=>{pos=p.coords;updOv()},
  e=>{$('st').textContent='GPS belum aktif: izinkan lokasi, atau isi koordinat manual.'},
  {enableHighAccuracy:true,maximumAge:5000,timeout:20000});
}

// ---- kamera
async function startCam(){
 try{
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1920},height:{ideal:1440}},audio:false});
  $('vid').srcObject=stream;$('st').textContent='Kamera siap.';
 }catch(e){$('st').textContent='Kamera tidak bisa dibuka di sini. Pakai tombol "Dari Galeri/Kamera HP".'}
}

// ---- gambar watermark ke canvas
function wrap(ctx,text,maxW){
 const out=[];text.split('\n').forEach(par=>{let line='';
  par.split(' ').forEach(w=>{const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t});
  out.push(line)});return out;
}
function render(src,w,h){
 const c=document.createElement('canvas');c.width=w;c.height=h;
 const x=c.getContext('2d');x.drawImage(src,0,0,w,h);
 const r=baris();
 if(r.length){
  const fs=Math.max(14,Math.round(w/45*$('ukuran').value)),pad=fs*0.8,lh=fs*1.3;
  let lines=[];
  r.forEach(it=>{x.font=(it.b?'bold ':'')+(it.b?fs*1.2:fs)+'px sans-serif';
   wrap(x,it.t,w-pad*2).forEach(l=>lines.push({t:l,b:it.b}))});
  const H=lines.length*lh+pad*2,y0=$('posisi').value==='atas'?0:h-H;
  x.fillStyle='rgba(0,0,0,0.5)';x.fillRect(0,y0,w,H);
  x.fillStyle='#fff';x.textBaseline='top';
  lines.forEach((l,i)=>{x.font=(l.b?'bold ':'')+(l.b?fs*1.2:fs)+'px sans-serif';x.fillText(l.t,pad,y0+pad+i*lh)});
 }
 return c;
}
function tampil(c){
 c.toBlob(b=>{hasilBlob=b;$('hasil').src=URL.createObjectURL(b);
  $('hasil').style.display='block';$('vid').style.display='none';$('ov').style.display='none';
  $('aksiCam').style.display='none';$('aksiHasil').style.display='block';},'image/jpeg',0.92);
}
$('btnFoto').onclick=()=>{
 const v=$('vid');if(!v.videoWidth){$('st').textContent='Kamera belum siap.';return}
 tampil(render(v,v.videoWidth,v.videoHeight));
};
$('btnUpload').onclick=()=>$('file').click();
$('file').onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 const img=new Image();img.onload=()=>{tampil(render(img,img.naturalWidth,img.naturalHeight))};
 img.src=URL.createObjectURL(f);e.target.value='';
};
$('btnBalik').onclick=()=>{facing=facing==='environment'?'user':'environment';startCam()};
$('btnUlang').onclick=()=>{
 $('hasil').style.display='none';$('vid').style.display='block';
 $('aksiCam').style.display='block';$('aksiHasil').style.display='none';updOv();
};
$('btnSimpan').onclick=async()=>{
 const name='geotag_'+Date.now()+'.jpg',file=new File([hasilBlob],name,{type:'image/jpeg'});
 try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(e){if(e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(hasilBlob);a.download=name;a.click();
};

// ---- event pengaturan
F.forEach(k=>$(k).addEventListener('input',()=>{
 $('koorManual').style.display=$('modeKoor').value==='manual'?'block':'none';save();updOv()}));
load();$('koorManual').style.display=$('modeKoor').value==='manual'?'block':'none';
updOv();setInterval(updOv,1000);startGPS();startCam();
</script>
</body>
</html>
